# A generic, single database configuration.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = postgresql://neondb_owner:npg_PnofHuBjd3U2@ep-late-rice-b3tznt7s-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
